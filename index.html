<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f2ec"><meta name="description" content="Ledgerline personal finance tracker"><link rel="icon" type="image/svg+xml" href="/ledgerline-mark.svg"><title>Ledgerline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard"><img class="brand-mark" src="/ledgerline-mark.svg" alt=""><span>ledger<span class="brand-dot">line</span></span></a>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">◫</span>Overview</button>
        <button class="nav-item" data-view="transactions"><span class="nav-icon">↗</span>Transactions</button>
        <button class="nav-item" data-view="budgets"><span class="nav-icon">◉</span>Budgets</button>
        <button class="nav-item" data-view="analytics"><span class="nav-icon">⌁</span>Insights</button>
        <button class="nav-item" data-view="reports"><span class="nav-icon">▤</span>Reports & export</button>
      </nav>
      <div class="sidebar-bottom"><div class="safe-card"><span class="safe-icon">✳</span><div><b>Your data stays yours.</b><p>Saved in this browser.</p></div></div><button class="profile-button" id="profileBtn"><span class="avatar">J</span><span class="profile-copy"><b>Personal account</b><small>Local workspace</small></span><span class="more">···</span></button></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button class="mobile-menu" id="menuBtn" aria-label="Open navigation">☰</button><div class="breadcrumb"><span>Workspace</span><i>/</i><b id="crumb">Overview</b></div><div class="top-actions"><label class="month-select"><span>◷</span><input id="monthPicker" type="month" aria-label="Choose month"></label><button class="icon-button" id="themeBtn" aria-label="Toggle dark mode">◐</button><button class="avatar top-avatar" id="topProfileBtn" type="button" title="Open profile menu" aria-label="Open profile menu" aria-expanded="false">J</button></div><div class="profile-menu" id="profileMenu" hidden><div class="profile-menu-user"><span class="avatar menu-avatar">J</span><span><b id="menuProfileName">Your account</b><small id="menuProfileEmail"></small></span></div><button type="button" id="openProfileSettings">Profile settings <span>›</span></button><button type="button" class="profile-menu-signout" id="menuSignOut">Sign out</button></div></header>
      <div class="content" id="content"><section class="boot-message"><img class="brand-mark" src="/ledgerline-mark.svg" alt="Ledgerline"><h1>Start Ledgerline to continue</h1><p>Open the <b>LedgerLine-Expense-Tracker</b> folder and double-click <b>Start Ledgerline.bat</b>. The website needs its local server for sign-in and Firebase.</p></section></div>
    </main>
  </div>
  <button class="quick-add" id="quickAdd"><span>＋</span> Add transaction</button>
  <div id="modalRoot"></div><div class="toast" id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script><script type="module" src="./app.js"></script>
</body></html>
